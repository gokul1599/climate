[project]
name = "monsoonverse"
version = "1.0.0"
description = "MonsoonVerse — India's Interactive Climate Digital Twin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
db = ["pg8000>=1.31", "python-dotenv>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
